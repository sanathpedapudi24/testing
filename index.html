<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Certificate Verification</title>
<style>
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #f4f4f4; font-family: Arial, Helvetica, sans-serif; color: #000; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 0; }
.card { background: #fff; width: 662px; max-width: 100%; border: 2px solid; border-image: linear-gradient(to right, #1a1ae6 0%, #1a1ae6 35%, #ff9f0a 100%) 1; padding: 48px 40px 52px; text-align: center; }
.logo { width: 232px; max-width: 70%; height: auto; display: block; margin: 0 auto; }
.tick { width: 80px; height: 80px; border-radius: 50%; background: #008000; color: #fff; font-size: 44px; line-height: 80px; margin: 30px auto 0; font-weight: bold; }
h1 { color: #0a3fe0; font-size: 24px; font-weight: bold; margin: 38px 0 52px; line-height: 1.3; }
table { margin: 0 auto; border-collapse: collapse; text-align: left; width: 100%; max-width: 480px; }
td { padding: 0; vertical-align: middle; font-size: 18px; line-height: 21px; height: 60px; }
td.l { font-weight: bold; width: 196px; padding-right: 12px; }
td.v { font-weight: normal; }
tr.tall td { height: 78px; }
@media (max-width: 600px) {
  body { padding: 0; align-items: stretch; }
  .card { width: 100%; border-left-width: 2px; padding: 40px 20px 48px; }
  h1 { font-size: 28px; line-height: 1.3; margin: 40px 0 44px; }
  td { font-size: 22px; line-height: 26px; height: 74px; }
  td.l { width: 118px; padding-right: 12px; }
  tr.tall td { height: 100px; }
  .tick { width: 96px; height: 96px; line-height: 96px; font-size: 52px; }
}
</style>
</head>
